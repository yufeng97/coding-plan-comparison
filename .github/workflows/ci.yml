name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 保持跨平台检出文件的 LF 换行
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 按 lockfile 安装固定开发依赖
        run: npm ci
      - name: 语法检查
        run: npm run check
      - name: 类型检查（checkJs）
        run: npm run typecheck
      - name: 数据校验
        run: npm run validate
      - name: 额度换算、用户流程与 HTTP 服务回归
        run: npm run test
      - name: 缓存版本号与文件一致（改动资产后须跑 npm run bump）
        run: npm run cache:check
      - name: 安装浏览器回归所需 Chromium
        run: npx playwright install --with-deps chromium
      - name: 真实浏览器回归
        run: npm run test:browser
      - name: 校验公共网站部署产物
        run: npm run build:site
      - name: 依赖安全检查
        run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org
