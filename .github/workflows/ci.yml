name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: 保持跨平台检出文件的 LF 换行
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 按 lockfile 安装固定开发依赖
        run: npm ci
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 语法检查
        run: npm run check
      - name: 类型检查（checkJs）
        run: npm run typecheck
      - name: 数据校验
        run: npm run validate
      - name: 生成的维护与测评公共数据匹配原始事实
        run: |
          npm run maintenance:check
          npm run benchmark:check
      - name: 额度换算、用户流程与 HTTP 服务回归
        run: npm run test
      - name: 缓存版本号与文件一致（改动资产后须跑 npm run bump）
        run: npm run cache:check
      - name: 安装 Chromium、Firefox 与 WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: 三种浏览器回归
        run: npm run test:browser
      - name: 上传失败截图与 trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: 校验公共网站部署产物
        if: success()
        run: npm run build:site
      - name: 依赖安全检查
        run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org
