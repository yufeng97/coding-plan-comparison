name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: 保持跨平台检出文件的 LF 换行
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: 按 lockfile 安装固定开发依赖
        run: npm ci
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 语法检查
        run: npm run check
      - name: 类型检查（checkJs）
        run: npm run typecheck
      - name: 数据校验
        run: npm run validate
      - name: 生成的维护与测评公共数据匹配原始事实
        run: |
          npm run maintenance:check
          npm run benchmark:check
      - name: 额度换算、用户流程与 HTTP 服务回归
        run: npm run test
      - name: 缓存版本号与文件一致（改动资产后须跑 npm run bump）
        run: npm run cache:check
      - name: 安装 Chromium、Firefox 与 WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: 三种浏览器回归
        run: npm run test:browser
      - name: 上传失败截图与 trace
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: 校验公共网站部署产物
        if: success()
        run: npm run build:site

  # 依赖公告检查单独运行：前面步骤失败时也照常执行；新公告或 registry 故障只让本作业显示失败，
  # 不阻塞 check、不让没有代码变化的 main 变红，也不阻挡等待 CI 成功的 Pages 发布。
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: 依赖安全检查（按 lockfile，不阻塞主检查）
        run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org
