name: 部署 GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: 手动发布也必须已有同一提交的完整 CI 成功记录
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          passed=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f head_sha="$DEPLOY_SHA" -f event=push -f status=success --jq '.workflow_runs | length')
          test "$passed" -gt 0 || { echo "当前提交尚未通过完整 CI，拒绝发布"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: npm
      - name: 按 lockfile 安装开发依赖（不执行依赖安装脚本）
        run: npm ci --ignore-scripts
      - name: 检查代码、数据与回归
        run: |
          npm run check
          npm run typecheck
          npm run validate
          npm run maintenance:check
          npm run benchmark:check
          npm test
          npm run cache:check
      - name: 生成白名单公共站点
        run: npm run build:site
      # .site-build 与 Vercel 部署共用；vercel.json 只对 Vercel 有意义，不随 Pages 公开。
      - name: 移除仅供 Vercel 使用的配置
        run: |
          rm -f .site-build/vercel.json
          test ! -e .site-build/vercel.json
      - name: 读取 GitHub Pages 配置
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: 上传公共站点产物
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .site-build
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
