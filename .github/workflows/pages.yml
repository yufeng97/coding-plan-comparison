name: 部署 GitHub Pages 与 Vercel

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      statuses: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      # 每日数据更新合入的提交没有 push 事件的 CI，由该工作流在候选提交上跑完整 CI 后写入 daily-data/full-ci 状态。
      - name: 确定发布提交；手动发布也必须已有同一提交的完整 CI 成功记录
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            passed=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f head_sha="$DEPLOY_SHA" -f event=push -f status=success --jq '.workflow_runs | length')
            daily=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEPLOY_SHA/statuses" --jq '[.[] | select(.context == "daily-data/full-ci" and .state == "success")] | length')
            test "$passed" -gt 0 || test "$daily" -gt 0 || { echo "当前提交尚未通过完整 CI，拒绝发布"; exit 1; }
          fi
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: target
    # 与每日数据更新的发布共用队列：同时只发布一次，排队中的旧提交被更新的提交替换。
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ needs.target.outputs.sha }}
    secrets: inherit
