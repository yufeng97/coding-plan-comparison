name: 手动采集 Coding Plan 资讯
on:
  workflow_dispatch:
    inputs:
      days:
        description: 最近多少天（1–365）
        type: number
        default: 14
permissions:
  contents: read
concurrency:
  group: news-inbox
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 为完整分支引用生成缓存命名空间
        id: cache-key
        env:
          NEWS_REF: ${{ github.ref }}
        run: node -e "const fs=require('node:fs'),crypto=require('node:crypto');fs.appendFileSync(process.env.GITHUB_OUTPUT,'prefix=news-inbox-v2-'+crypto.createHash('sha256').update(process.env.NEWS_REF).digest('hex')+'--\n');"
      - name: 恢复已审队列与页面基线
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: audit/news/*.json
          key: ${{ steps.cache-key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}
            news-inbox-${{ github.ref_name }}-
      - name: 采集候选（不修改价格、不提交或部署）
        id: collect
        continue-on-error: true
        env:
          NEWS_WINDOW_DAYS: ${{ inputs.days }}
        run: node scripts/news/collect-news.js --days "$NEWS_WINDOW_DAYS"
      - name: 保留本次队列与缓存
        if: ${{ always() && steps.collect.outputs.cache-ready == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: audit/news/*.json
          key: ${{ steps.cache-key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
      - name: 下载待审队列、来源健康与报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coding-plan-news-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit/news/*.json
          retention-days: 30
          if-no-files-found: error
      - name: 来源部分失败时仍明确标记失败
        if: steps.collect.outcome == 'failure'
        run: exit 1
