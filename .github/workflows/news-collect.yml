name: 每日与手动采集 Coding Plan 资讯
on:
  # UTC 00:17，即北京时间每天 08:17；不需要 Claude 凭据。
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: 最近多少天（1–365）
        type: number
        default: 14
permissions:
  contents: read
concurrency:
  group: news-inbox
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 为完整分支引用生成缓存命名空间
        id: cache-key
        env:
          NEWS_REF: ${{ github.ref }}
        run: node -e "const fs=require('node:fs'),crypto=require('node:crypto');fs.appendFileSync(process.env.GITHUB_OUTPUT,'prefix=news-inbox-v2-'+crypto.createHash('sha256').update(process.env.NEWS_REF).digest('hex')+'--\n');"
      - name: 恢复已审队列与页面基线
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/audit/news/*.json
          key: ${{ steps.cache-key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}
      - name: 隔离损坏的待审队列
        id: quarantine
        run: node -e "const fs=require('node:fs'); const {quarantineCorruptInbox}=require('./scripts/news/collect-news'); const dest=quarantineCorruptInbox('data/audit/news'); if(dest){console.log('已隔离损坏队列：'+dest); if(process.env.GITHUB_OUTPUT) fs.appendFileSync(process.env.GITHUB_OUTPUT,'corrupt=true\n');}"
      - name: 删除已损坏的旧缓存，避免下一轮再次恢复
        if: steps.quarantine.outputs.corrupt == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_PREFIX: ${{ steps.cache-key.outputs.prefix }}
        run: |
          ids=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/caches" -f key="$CACHE_PREFIX" -f per_page=100 --jq '.actions_caches[].id')
          for id in $ids; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}"
          done
      - name: 采集候选（不修改价格、不提交或部署）
        id: collect
        continue-on-error: true
        env:
          NEWS_WINDOW_DAYS: ${{ inputs.days || 14 }}
        run: node scripts/news/collect-news.js --days "$NEWS_WINDOW_DAYS"
      - name: 保留本次队列与缓存
        if: ${{ always() && steps.collect.outputs.cache-ready == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/audit/news/*.json
          key: ${{ steps.cache-key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
      - name: 下载待审队列、来源健康与报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coding-plan-news-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/audit/news/*.json
            data/audit/news-corrupt/*.json
          retention-days: 30
          if-no-files-found: error
      - name: 来源部分失败时仍明确标记失败
        if: steps.collect.outcome == 'failure'
        run: exit 1
