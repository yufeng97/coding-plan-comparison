name: 手动采集模型公开评测
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchmark-collect-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 抓取官方成绩候选（不修改正式数据、不部署）
        run: npm run benchmark:collect
      - name: 下载候选、原始哈希证据与来源健康
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-benchmark-review-${{ github.run_id }}
          path: audit/benchmark-sources/
          retention-days: 30
          if-no-files-found: error
