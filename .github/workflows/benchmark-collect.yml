name: 手动采集模型公开评测
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchmark-collect-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 抓取官方成绩候选（不修改正式数据、不部署）
        run: npm run benchmark:collect
      - name: 下载候选、原始哈希证据与来源健康
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-benchmark-review-${{ github.run_id }}
          path: audit/benchmark-sources/
          retention-days: 30
          if-no-files-found: error
