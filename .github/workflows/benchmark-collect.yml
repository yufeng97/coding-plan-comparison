name: 手动采集模型公开评测
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 抓取官方成绩候选（不修改正式数据、不部署）
        run: npm run benchmark:collect
      - name: 下载候选、原始哈希证据与来源健康
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-benchmark-review-${{ github.run_id }}
          path: audit/benchmark-sources/
          retention-days: 30
          if-no-files-found: error
